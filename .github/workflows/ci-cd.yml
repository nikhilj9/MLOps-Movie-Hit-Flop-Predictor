name: MLOps Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create test data directory
      run: mkdir -p test_data

    - name: Run linter
      run: ruff check . --fix --exit-zero

    - name: Run unit tests with coverage
      run: |
        python -m pytest tests/test_unit_*.py -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short

    - name: Run integration tests
      run: |
        python -m pytest tests/test_integration.py -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t movie-prediction:${{ github.sha }} .
        docker tag movie-prediction:${{ github.sha }} movie-prediction:latest

    - name: Test Docker container
      run: |
        docker run --rm movie-prediction:latest python -c "import src.main; print('Build successful')"